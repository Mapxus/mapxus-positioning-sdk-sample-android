[versions]
agp = "8.10.1"
kotlin = "2.0.21"
material = "1.6.1"
material3 = "1.2.1"
mapxus-positioning = "3.2.0"
mapxus-map = "11.0.0"
navigation-compose = "2.7.2"
compose-bom = "2023.09.01"
permissionx = "1.6.1"
datastore-preferences = "1.1.7"
coil-compose = "2.7.0"
coil-gif = "2.7.0"

[libraries]
coil-gif = { module = "io.coil-kt:coil-gif", version.ref = "coil-gif" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil-compose" }
kotlin-gradle = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
mapxus-positioning = { module = "com.mapxus.positioning:positioning", version.ref = "mapxus-positioning" }
mapxus-map = { module = "com.mapxus.map:mapxusmap", version.ref = "mapxus-map" }
google-material = { module = "com.google.android.material:material", version.ref = "material" }
compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
permissionx = { module = "com.guolindev.permissionx:permissionx", version.ref = "permissionx" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore-preferences" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

